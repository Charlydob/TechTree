services:
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3003}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "127.0.0.1:${PORT:-3003}:${PORT:-3003}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3003}/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - default
      - charly-stack

networks:
  charly-stack:
    external: true
    name: charly-stack_default